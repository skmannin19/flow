<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#312e81" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Flow Squircle Background -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#flowGrad)" filter="url(#shadow)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Flow Electric Bolt -->
  <path d="M35 12 L20 33 L32 33 L28 52 L44 29 L32 29 Z" fill="url(#boltGrad)" filter="url(#boltGlow)" stroke="#ffffff" stroke-width="0.75" stroke-linejoin="round" />
</svg>
